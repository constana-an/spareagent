name: ci

on:
  push:
  pull_request:

jobs:
  week1-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure local env (mock provider, no secrets)
        run: cp .env.example .env
      - name: Start stack
        run: make up
      - name: Migrate (from empty DB) and seed twice
        run: make migrate && make seed-dev && make seed-dev
      - name: Lint + OpenAPI validation
        run: make lint
      - name: Tests (coverage gate 80%)
        run: make test
      - name: Smoke
        run: make smoke
      - name: Week 2 three-worker remote demo
        run: make e2e-remote
      - name: Upload e2e report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: week2-e2e-report
          path: reports/week2_e2e_report.json
          if-no-files-found: ignore
      - name: Logs on failure
        if: failure()
        run: docker compose --profile remote logs --tail=300
