name: ci

on:
  # A PR's commits are checked by the pull_request run; push runs only for main itself.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# CI uses fake Codex / simulated devices only. Never enable subscription execution here.
env:
  EXPERIMENT_LIVE_ENABLED: "false"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  worker-package:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build_worker_bundle.py
      - run: python scripts/check_worker_wheel.py output/worker-bundle/spareagent_worker-*-py3-none-any.whl
      - name: Menu-bar App compiles and passes its self-test
        if: runner.os == 'macOS'
        run: |
          xcrun swiftc -swift-version 5 -O -target "$(uname -m)-apple-macos13.0" \
            apps/macos/SpareAgent.swift -o "$RUNNER_TEMP/SpareAgent"
          "$RUNNER_TEMP/SpareAgent" --self-test
      - uses: actions/upload-artifact@v4
        with:
          name: worker-bundle-${{ matrix.os }}
          path: output/worker-bundle/*

  friends-web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - run: npm run typecheck

  # week1-gate takes ~9 minutes. A PR that only touches docs, Markdown, the member web
  # app (checked by friends-web) or the Mac launcher (compiled on macOS by worker-package)
  # cannot change its result, so it is skipped there. main always runs it.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      gate: ${{ steps.diff.outputs.gate }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "gate=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed="$(git diff --name-only "$BASE"...HEAD)"
          printf '%s\n' "$changed"
          gate=true
          # A here-string, not a pipe: with pipefail an early grep exit could flip the test.
          if [ -n "$changed" ] && ! grep -qvE '^(docs/|apps/web/|apps/macos/)|\.md$' <<< "$changed"; then
            gate=false
          fi
          echo "gate=$gate" | tee -a "$GITHUB_OUTPUT"

  week1-gate:
    needs: changes
    if: needs.changes.outputs.gate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure local env (mock provider, no secrets)
        run: cp .env.example .env
      - name: Start stack
        run: make up
      - name: Migrate (from empty DB) and seed twice
        run: make migrate && make seed-dev && make seed-dev
      - name: Lint + OpenAPI validation
        run: make lint
      - name: Tests (coverage gate 80%; sandbox + real-GitHub checkout tests enabled)
        run: make test
        env:
          SPAREAGENT_NETWORK_TESTS: "1"
      - name: Smoke
        run: make smoke
      - name: Week 2 three-worker remote demo
        run: make e2e-remote
      - name: Week 3 sandboxed code execution + independent verification demo
        run: make e2e-code
      - name: Upload e2e report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports
          path: reports/*.json
          if-no-files-found: ignore
      - name: Logs on failure
        if: failure()
        run: docker compose --profile remote --profile code logs --tail=300
