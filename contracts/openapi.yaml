components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
    enrollmentToken: {type: http, scheme: bearer, description: 'single-use sa_enr_ token'}
    nodeKey: {type: http, scheme: bearer, description: 'long-lived sa_nk_ node key (token exchange only)'}
    nodeAuth: {type: http, scheme: bearer, description: 'short-lived node-scoped sa_at_ access token'}
  parameters:
    WorkerId:
      in: path
      name: worker_id
      required: true
      schema: {type: string, format: uuid}
    LeaseId:
      in: path
      name: lease_id
      required: true
      schema: {type: string, format: uuid}
    TaskId:
      in: path
      name: task_id
      required: true
      schema: {type: string, format: uuid}
  responses:
    ApiError:
      description: standard error envelope
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
  schemas:
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code: {type: string}
            message: {type: string}
            request_id: {type: string}
    TaskCreate:
      type: object
      additionalProperties: false
      required: [task_type, repository_url, commit_sha, prompt, max_budget_cents, max_duration_seconds]
      properties:
        task_type: {type: string, enum: [CODE_FIX, REFACTOR, WRITE_TESTS]}
        repository_url: {type: string, format: uri, pattern: '^https://github\.com/'}
        commit_sha: {type: string, pattern: '^[a-fA-F0-9]{40}$'}
        prompt: {type: string, minLength: 1, maxLength: 12000}
        max_budget_cents: {type: integer, minimum: 1, maximum: 10000000}
        max_duration_seconds: {type: integer, minimum: 10, maximum: 7200}
    Task:
      type: object
      required: [id, status, task_type, max_budget_cents, created_at]
      properties:
        id: {type: string, format: uuid}
        status: {type: string, enum: [CREATED, QUEUED, RESERVED, RUNNING, VERIFYING, RETRY_PENDING, CANCELLING, SUCCEEDED, FAILED, CANCELLED, TIMED_OUT]}
        task_type: {type: string}
        max_budget_cents: {type: integer}
        created_at: {type: string, format: date-time}
        result_summary: {type: [string, 'null']}
    Artifact:
      type: object
      required: [id, kind, sha256, media_type, source]
      description: 'Only published artifacts are listed. For CODE tasks, worker artifacts are published only after independent platform verification passes; VERIFICATION_REPORT is always platform-sourced.'
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [PATCH, TEST_REPORT, LOG, SUMMARY, EXECUTION_LOG, VERIFICATION_REPORT]}
        sha256: {type: string}
        media_type: {type: string}
        source: {type: string, enum: [WORKER, PLATFORM]}
    Model:
      type: object
      required: [id, object, owned_by]
      properties:
        id: {type: string}
        object: {type: string, const: model}
        owned_by: {type: string}
    ChatRequest:
      type: object
      required: [model, messages]
      properties:
        model: {type: string}
        stream: {type: boolean, default: false}
        max_tokens: {type: integer, minimum: 1, maximum: 8192}
        temperature: {type: number, minimum: 0, maximum: 2}
        messages:
          type: array
          minItems: 1
          items:
            type: object
            required: [role, content]
            properties:
              role: {type: string, enum: [system, developer, user, assistant]}
              content: {type: string}
    ChatResponse:
      type: object
      required: [id, object, created, model, choices, usage]
      properties:
        id: {type: string}
        object: {type: string, const: chat.completion}
        created: {type: integer}
        model: {type: string}
        choices:
          type: array
          items:
            type: object
            required: [index, message, finish_reason]
            properties:
              index: {type: integer}
              message:
                type: object
                required: [role, content]
                properties:
                  role: {type: string, const: assistant}
                  content: {type: string}
              finish_reason: {type: string}
        usage:
          type: object
          required: [prompt_tokens, completion_tokens, total_tokens]
          properties:
            prompt_tokens: {type: integer}
            completion_tokens: {type: integer}
            total_tokens: {type: integer}
    WorkerRegistration:
      type: object
      additionalProperties: false
      required: [resource_id, name, capabilities]
      properties:
        resource_id: {type: string, format: uuid}
        name: {type: string, pattern: '^[A-Za-z0-9._-]{1,100}$'}
        capabilities: {type: object}
        max_concurrency: {type: integer, minimum: 1, maximum: 100, default: 1}
    NodeRegistration:
      type: object
      required: [worker_id, node_key, node_key_expires_at, access_token, access_token_expires_at]
      properties:
        worker_id: {type: string, format: uuid}
        node_key: {type: string}
        node_key_expires_at: {type: string, format: date-time}
        access_token: {type: string}
        access_token_expires_at: {type: string, format: date-time}
    EnrollmentCreate:
      type: object
      additionalProperties: false
      required: [resource_id]
      properties:
        resource_id: {type: string, format: uuid}
        ttl_seconds: {type: integer, minimum: 60, maximum: 604800, default: 3600}
    EnrollmentToken:
      type: object
      required: [id, token, resource_id, expires_at]
      properties:
        id: {type: string, format: uuid}
        token: {type: string}
        resource_id: {type: string, format: uuid}
        expires_at: {type: string, format: date-time}
    WorkerSelf:
      type: object
      required: [worker_id, resource_id, name, status, max_concurrency, active_tasks]
      properties:
        worker_id: {type: string, format: uuid}
        resource_id: {type: string, format: uuid}
        name: {type: string}
        status: {type: string}
        max_concurrency: {type: integer}
        active_tasks: {type: integer}
        last_heartbeat: {type: [string, 'null'], format: date-time}
    LeaseAssignment:
      type: object
      required: [lease_id, attempt_id, attempt_number, leased_until, lease_seconds, task]
      properties:
        lease_id: {type: string, format: uuid}
        attempt_id: {type: string, format: uuid}
        attempt_number: {type: integer}
        leased_until: {type: string, format: date-time}
        lease_seconds: {type: integer}
        execution_profile: {type: string, enum: [MOCK, CODE, CODEX_LIVE], default: MOCK, description: 'W3: CODE leases require the sandboxed code executor. W4: CODEX_LIVE leases run on the owner''s own Codex CLI (experimental scope only)'}
        resource_scope: {type: string, enum: [PUBLIC_MARKETPLACE, EXPERIMENTAL_SHARED_SUBSCRIPTION], default: PUBLIC_MARKETPLACE}
        authorization_ref: {anyOf: [{type: string, format: uuid}, {type: 'null'}], description: 'W4: authorization record an experimental lease relies on'}
        task:
          type: object
          required: [task_id, task_type, repository_url, commit_sha, prompt, max_duration_seconds, max_budget_cents]
          properties:
            task_id: {type: string, format: uuid}
            task_type: {type: string}
            repository_url: {type: string}
            commit_sha: {type: string}
            prompt: {type: string, description: 'secret-redacted before leaving the API'}
            max_duration_seconds: {type: integer}
            max_budget_cents: {type: integer}
    LeaseState:
      type: object
      required: [leased_until, cancel_requested]
      properties:
        leased_until: {type: [string, 'null'], format: date-time}
        cancel_requested: {type: boolean}
    LeaseCompletion:
      type: object
      additionalProperties: false
      required: [finalization_key, succeeded]
      properties:
        finalization_key: {type: string, minLength: 8, maxLength: 128}
        succeeded: {type: boolean}
        result_summary: {type: string, maxLength: 2000}
        retryable: {type: boolean, default: false}
        error_code: {type: string, enum: [TRANSIENT_PROVIDER_ERROR, PERMANENT_PROVIDER_ERROR, NO_RESULT, WORKER_SHUTDOWN, CANCELLED, EXECUTION_ERROR, SUBSCRIPTION_USAGE_LIMIT, SUBSCRIPTION_AUTH_UNAVAILABLE, OWNER_ONLY_VIOLATION, SHARED_WORK_REFUSED]}
        timed_out: {type: boolean, default: false}
        artifacts:
          type: array
          maxItems: 8
          items:
            type: object
            additionalProperties: false
            required: [kind, name, media_type, content_base64]
            properties:
              kind: {type: string, enum: [PATCH, TEST_REPORT, LOG, SUMMARY, EXECUTION_LOG]}
              name: {type: string, pattern: '^[A-Za-z0-9._-]{1,100}$'}
              media_type: {type: string, enum: [text/plain, text/x-diff, application/json]}
              content_base64: {type: string}
    ExperimentalGroupCreate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        max_members:
          type: integer
          minimum: 2
          maximum: 20
        max_concurrent_tasks:
          type: integer
          minimum: 1
          maximum: 4
        max_tasks_per_day:
          type: integer
          minimum: 1
          maximum: 50
        max_task_duration_seconds:
          type: integer
          minimum: 10
          maximum: 3600
        allowed_task_types:
          type: array
          items:
            type: string
            enum:
            - CODE_REVIEW
            - WRITE_TESTS
            - CODE_FIX
          minItems: 1
      required:
      - name
      additionalProperties: false
    ExperimentalMember:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - INVITED
          - ACTIVE
          - REMOVED
        invited_at:
          type: string
          format: date-time
        joined_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
      required:
      - user_id
      - status
      - invited_at
      - joined_at
    ExperimentalAuthorization:
      type: object
      properties:
        id:
          type: string
          format: uuid
        provider_name:
          type: string
        authorization_source:
          type: string
        authorization_reference:
          type: string
        authorization_scope:
          type: object
        verification_status:
          type: string
          enum:
          - UNVERIFIED
          - OPERATOR_VERIFIED
          - REJECTED
        integration_route_covered:
          type: boolean
        verified_by:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
        verified_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        expires_at:
          type: string
          format: date-time
        revoked_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        created_at:
          type: string
          format: date-time
        integration_route:
          anyOf:
          - type: string
          - type: 'null'
        max_participants:
          anyOf:
          - type: integer
          - type: 'null'
        live_execution_enabled:
          type: boolean
          description: true only if this record currently permits LIVE dispatch and EXPERIMENT_LIVE_ENABLED is on
      required:
      - id
      - verification_status
      - expires_at
      - live_execution_enabled
    ExperimentalGroup:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
          enum:
          - ACTIVE
          - DISABLED
        sharing_enabled:
          type: boolean
        max_members:
          type: integer
        max_concurrent_tasks:
          type: integer
        max_tasks_per_day:
          type: integer
        max_task_duration_seconds:
          type: integer
        allowed_task_types:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        members:
          type: array
          items:
            $ref: '#/components/schemas/ExperimentalMember'
        authorization:
          anyOf:
          - $ref: '#/components/schemas/ExperimentalAuthorization'
          - type: 'null'
      required:
      - id
      - name
      - status
      - sharing_enabled
      - max_members
    ExperimentalInvite:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
      required:
      - user_id
      additionalProperties: false
    ExperimentalConsent:
      type: object
      properties:
        terms_version:
          type: string
          minLength: 1
          maxLength: 64
        acknowledgements:
          type: object
          additionalProperties:
            type: boolean
      required:
      - terms_version
      - acknowledgements
      additionalProperties: false
    ExperimentalAuthorizationCreate:
      type: object
      properties:
        provider_name:
          type: string
          enum:
          - openai-codex
        authorization_source:
          type: string
          enum:
          - VENDOR_SUPPORT_CORRESPONDENCE
          - VENDOR_WRITTEN_AGREEMENT
        authorization_reference:
          type: string
          minLength: 1
          maxLength: 200
          pattern: ^[A-Za-z0-9 ._:#/-]+$
        authorization_scope:
          type: object
        integration_route:
          type: string
          enum:
          - CODEX_CLI_EXEC
        max_participants:
          type: integer
          minimum: 2
          maximum: 20
        expires_at:
          type: string
          format: date-time
      required:
      - provider_name
      - authorization_source
      - authorization_reference
      - expires_at
      additionalProperties: false
    ExperimentalAuthorizationVerify:
      type: object
      properties:
        verification_status:
          type: string
          enum:
          - OPERATOR_VERIFIED
          - REJECTED
        integration_route_covered:
          type: boolean
          default: false
      required:
      - verification_status
      additionalProperties: false
    ExperimentalGroupSharing:
      type: object
      properties:
        enabled:
          type: boolean
      required:
      - enabled
      additionalProperties: false
    ExperimentalKillSwitch:
      type: object
      properties:
        groups_disabled:
          type: integer
        tasks_cancelled:
          type: integer
      required:
      - groups_disabled
      - tasks_cancelled
    ExperimentalDispatchDecision:
      type: object
      properties:
        id:
          type: integer
        task_id:
          type: string
          format: uuid
        connection_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
        authorization_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
        decision:
          type: string
          enum:
          - ALLOW
          - DENY
        reasons:
          type: array
          items:
            type: string
        execution_mode:
          type: string
          enum:
          - SIMULATED
          - LIVE
        attempt_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
        created_at:
          type: string
          format: date-time
      required:
      - id
      - task_id
      - decision
      - reasons
      - execution_mode
      - created_at
    SubscriptionConnect:
      type: object
      properties:
        worker_id:
          type: string
          format: uuid
        device_label:
          type: string
          minLength: 1
          maxLength: 80
        subscription_type:
          type: string
          enum:
          - PLUS
          - PRO
          - UNKNOWN
          default: UNKNOWN
        auth_method:
          type: string
          enum:
          - CHATGPT
          - API_KEY
          - NOT_LOGGED_IN
          - UNKNOWN
          description: as reported by `spareagent-worker codex-check`; only CHATGPT is accepted
      required:
      - worker_id
      - device_label
      - auth_method
      additionalProperties: false
    SubscriptionConnection:
      type: object
      properties:
        id:
          type: string
          format: uuid
        worker_id:
          type: string
          format: uuid
        provider_name:
          type: string
        subscription_type:
          type: string
        auth_method:
          type: string
          const: CHATGPT
        auth_state:
          type: string
          enum:
          - VALID
          - EXPIRED
          - UNKNOWN
        device_label:
          type: string
        status:
          type: string
          enum:
          - CONNECTED
          - DISCONNECTED
        last_auth_check_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        created_at:
          type: string
          format: date-time
        owner_check_passed_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        no_purchased_credits_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
      required:
      - id
      - worker_id
      - auth_method
      - auth_state
      - status
    SharingPreferences:
      type: object
      properties:
        connection_id:
          type: string
          format: uuid
        group_id:
          type: string
          format: uuid
        sharing_state:
          type: string
          enum:
          - DISABLED
          - ENABLED
          - PAUSED
          - REVOKED
        consent_terms_version:
          anyOf:
          - type: string
          - type: 'null'
        consent_accepted_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        max_concurrent_tasks:
          type: integer
        max_tasks_per_day:
          type: integer
        max_task_duration_seconds:
          type: integer
        allowed_task_types:
          type: array
          items:
            type: string
        require_owner_approval:
          type: boolean
        advance_consent_requester_ids:
          type: array
          items:
            type: string
        allow_paid_credits:
          type: boolean
          const: false
        paused_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        revoked_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
      required:
      - connection_id
      - group_id
      - sharing_state
      - allow_paid_credits
    SharingPreferencesUpdate:
      type: object
      properties:
        connection_id:
          type: string
          format: uuid
        group_id:
          type: string
          format: uuid
        max_concurrent_tasks:
          type: integer
          minimum: 1
          maximum: 4
        max_tasks_per_day:
          type: integer
          minimum: 0
          maximum: 50
        max_task_duration_seconds:
          type: integer
          minimum: 10
          maximum: 3600
        allowed_task_types:
          type: array
          items:
            type: string
            enum:
            - CODE_REVIEW
            - WRITE_TESTS
            - CODE_FIX
          minItems: 1
        require_owner_approval:
          type: boolean
        advance_consent_requester_ids:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 20
        allow_paid_credits:
          type: boolean
          const: false
      required:
      - connection_id
      - group_id
      additionalProperties: false
    SharingEnable:
      type: object
      properties:
        connection_id:
          type: string
          format: uuid
        terms_version:
          type: string
          minLength: 1
          maxLength: 64
        acknowledgements:
          type: object
          additionalProperties:
            type: boolean
      required:
      - connection_id
      - terms_version
      - acknowledgements
      additionalProperties: false
    SharingTarget:
      type: object
      properties:
        connection_id:
          type: string
          format: uuid
      required:
      - connection_id
      additionalProperties: false
    SubscriptionStatus:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              connection:
