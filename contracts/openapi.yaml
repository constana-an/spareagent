openapi: 3.1.0
info:
  title: SpareAgent MVP API
  version: 1.4.0
  description: 'W1: Tasks, Events, Models, Chat nonstream, health. W2: remote worker enrollment, node credentials and lease protocol.'
servers:
  - url: http://localhost:8000
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      operationId: health
      security: []
      responses:
        '200': {description: alive}
  /readyz:
    get:
      operationId: ready
      security: []
      responses:
        '200': {description: dependencies ready}
        '503': {description: unavailable}
  /v1/tasks:
    post:
      operationId: createTask
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string, minLength: 8, maxLength: 128}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TaskCreate'}
      responses:
        '202':
          description: accepted or same-key replay
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Task'}
        '400': {$ref: '#/components/responses/ApiError'}
        '401': {$ref: '#/components/responses/ApiError'}
        '409': {$ref: '#/components/responses/ApiError'}
        '422': {$ref: '#/components/responses/ApiError'}
    get:
      operationId: listTasks
      parameters:
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {in: query, name: cursor, schema: {type: string}}
      responses:
        '200':
          description: paginated tasks for current user
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Task'}}
                  next_cursor: {type: [string, 'null']}
  /v1/tasks/{task_id}:
    get:
      operationId: getTask
      parameters: [{$ref: '#/components/parameters/TaskId'}]
      responses:
        '200': {description: task, content: {application/json: {schema: {$ref: '#/components/schemas/Task'}}}}
        '403': {$ref: '#/components/responses/ApiError'}
        '404': {$ref: '#/components/responses/ApiError'}
  /v1/tasks/{task_id}/cancel:
    post:
      operationId: cancelTask
      parameters: [{$ref: '#/components/parameters/TaskId'}]
      responses:
        '202': {description: cancellation requested, content: {application/json: {schema: {$ref: '#/components/schemas/Task'}}}}
        '409': {$ref: '#/components/responses/ApiError'}
  /v1/tasks/{task_id}/events:
    get:
      operationId: streamTaskEvents
      parameters:
        - {$ref: '#/components/parameters/TaskId'}
        - {in: header, name: Last-Event-ID, schema: {type: string}}
      responses:
        '200':
          description: SSE stream, event.id is monotonically increasing seq
          content:
            text/event-stream:
              schema: {type: string}
  /v1/tasks/{task_id}/artifacts:
    get:
      operationId: listTaskArtifacts
      parameters: [{$ref: '#/components/parameters/TaskId'}]
      responses:
        '200':
          description: artifact descriptors (authorization required)
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Artifact'}}
  /v1/models:
    get:
      operationId: listModels
      responses:
        '200':
          description: available approved model aliases
          content:
            application/json:
              schema:
                type: object
                properties:
                  object: {type: string, const: list}
                  data: {type: array, items: {$ref: '#/components/schemas/Model'}}
  /v1/chat/completions:
    post:
      operationId: createChatCompletion
      description: W1 only nonstream and mock provider; stream=true explicitly returns 422.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChatRequest'}
      responses:
        '200':
          description: generated response
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChatResponse'}
        '404': {$ref: '#/components/responses/ApiError'}
        '422': {$ref: '#/components/responses/ApiError'}
        '429': {$ref: '#/components/responses/ApiError'}
  /v1/enrollment-tokens:
    post:
      operationId: createEnrollmentToken
      description: 'W2. ADMIN for any public-type resource, or PROVIDER for an own admin-APPROVED resource. PERSONAL_SUBSCRIPTION is always refused. Token is single use and shown once.'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EnrollmentCreate'}
      responses:
        '201':
          description: enrollment token (secret shown once)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EnrollmentToken'}
        '401': {$ref: '#/components/responses/ApiError'}
        '403': {$ref: '#/components/responses/ApiError'}
        '404': {$ref: '#/components/responses/ApiError'}
        '422': {$ref: '#/components/responses/ApiError'}
  /v1/admin/workers/{worker_id}/revoke:
    post:
      operationId: revokeWorker
      description: 'W2. ADMIN only. Revokes all node credentials and expires active leases (tasks are retried or failed).'
      parameters: [{$ref: '#/components/parameters/WorkerId'}]
      responses:
        '200':
          description: revoked
          content:
            application/json:
              schema:
                type: object
                required: [worker_id, revoked, leases_expired]
                properties:
                  worker_id: {type: string, format: uuid}
                  revoked: {type: boolean}
                  leases_expired: {type: integer}
        '403': {$ref: '#/components/responses/ApiError'}
        '404': {$ref: '#/components/responses/ApiError'}
  /v1/workers/register:
    post:
      operationId: registerWorker
      description: 'W2. Authorization: Bearer <enrollment token>. Anonymous or consumer/dev authentication is rejected. Registration never grants marketplace eligibility.'
      security: [{enrollmentToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WorkerRegistration'}
      responses:
        '201':
          description: created worker; node key and access token shown once
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NodeRegistration'}
        '401': {$ref: '#/components/responses/ApiError'}
        '403': {$ref: '#/components/responses/ApiError'}
        '422': {$ref: '#/components/responses/ApiError'}
  /v1/workers/token:
    post:
      operationId: exchangeNodeKey
      description: 'W2. Authorization: Bearer <node key>. Returns a short-lived node-scoped access token.'
      security: [{nodeKey: []}]
      responses:
        '200':
          description: access token
          content:
            application/json:
              schema:
                type: object
                required: [worker_id, access_token, expires_at]
                properties:
                  worker_id: {type: string, format: uuid}
                  access_token: {type: string}
                  expires_at: {type: string, format: date-time}
        '401': {$ref: '#/components/responses/ApiError'}
  /v1/workers/me:
    get:
      operationId: getWorkerSelf
      security: [{nodeAuth: []}]
      responses:
        '200':
          description: this node as seen by the API
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkerSelf'}
        '401': {$ref: '#/components/responses/ApiError'}
  /v1/workers/{worker_id}/credentials/rotate:
    post:
      operationId: rotateNodeCredentials
      description: 'W2. Revokes every live credential of the node and issues a new node key + access token.'
      security: [{nodeAuth: []}]
      parameters: [{$ref: '#/components/parameters/WorkerId'}]
      responses:
        '200':
          description: rotated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NodeRegistration'}
        '401': {$ref: '#/components/responses/ApiError'}
        '403': {$ref: '#/components/responses/ApiError'}
  /v1/workers/{worker_id}/heartbeat:
    post:
      operationId: workerHeartbeat
      security: [{nodeAuth: []}]
      parameters: [{$ref: '#/components/parameters/WorkerId'}]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                state: {type: string, enum: [ONLINE, DRAINING, OFFLINE], default: ONLINE}
                capabilities: {type: object}
      responses:
        '204': {description: heartbeat recorded}
        '401': {$ref: '#/components/responses/ApiError'}
        '403': {$ref: '#/components/responses/ApiError'}
  /v1/workers/{worker_id}/leases/next:
    get:
      operationId: pollLease
      description: 'W2. Bounded long poll (server caps wait). Returns an existing reservation for this node or atomically claims the oldest eligible task within the node''s capacity.'
      security: [{nodeAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/WorkerId'}
        - {in: query, name: wait_seconds, schema: {type: number, minimum: 0, maximum: 60, default: 20}}
      responses:
        '200':
          description: lease assignment
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LeaseAssignment'}
        '204': {description: no work within the wait window}
        '401': {$ref: '#/components/responses/ApiError'}
        '403': {$ref: '#/components/responses/ApiError'}
  /v1/leases/{lease_id}/accept:
    post:
      operationId: acceptLease
      security: [{nodeAuth: []}]
      parameters: [{$ref: '#/components/parameters/LeaseId'}]
      responses:
        '204': {description: accepted}
        '403': {$ref: '#/components/responses/ApiError'}
        '409': {$ref: '#/components/responses/ApiError'}
  /v1/leases/{lease_id}/progress:
    post:
      operationId: reportLeaseProgress
      description: 'W2. Records a progress event and renews the lease; cancel_requested tells the node to stop.'
      security: [{nodeAuth: []}]
      parameters: [{$ref: '#/components/parameters/LeaseId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [message, percent]
              properties:
                message: {type: string, maxLength: 500}
                percent: {type: integer, minimum: 0, maximum: 100}
      responses:
        '200':
          description: lease state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LeaseState'}
        '403': {$ref: '#/components/responses/ApiError'}
        '409': {$ref: '#/components/responses/ApiError'}
  /v1/leases/{lease_id}/renew:
    post:
      operationId: renewLease
      security: [{nodeAuth: []}]
      parameters: [{$ref: '#/components/parameters/LeaseId'}]
      responses:
        '200':
          description: lease state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LeaseState'}
        '403': {$ref: '#/components/responses/ApiError'}
        '409': {$ref: '#/components/responses/ApiError'}
  /v1/leases/{lease_id}/complete:
    post:
      operationId: completeLease
      description: 'Finalizes an attempt exactly once per finalization_key; replay with the same key returns replayed=true. Usage is computed by the API, never reported by the node. Retryability is decided by the API.'
      security: [{nodeAuth: []}]
      parameters: [{$ref: '#/components/parameters/LeaseId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LeaseCompletion'}
      responses:
        '200':
          description: 'finalized; idempotent replay permitted'
          content:
            application/json:
              schema:
                type: object
                required: [task_status, replayed]
                properties:
                  task_status: {type: string}
                  replayed: {type: boolean}
        '403': {$ref: '#/components/responses/ApiError'}
        '409': {$ref: '#/components/responses/ApiError'}
        '413': {$ref: '#/components/responses/ApiError'}
        '422': {$ref: '#/components/responses/ApiError'}
  /v1/tasks/{task_id}/artifacts/{artifact_id}/content:
    get:
      operationId: getTaskArtifactContent
      x-spareagent-extension: 'W1 addition (docs/DECISIONS.md D-07): owner-only artifact download, served as attachment with nosniff.'
      parameters:
        - {$ref: '#/components/parameters/TaskId'}
        - {in: path, name: artifact_id, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: raw artifact bytes; X-Artifact-SHA256 header carries the digest
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        '404': {$ref: '#/components/responses/ApiError'}
  /v1/admin/resources/{resource_id}/approve:
    post:
      operationId: approveResource
      x-spareagent-extension: 'W1 addition (docs/DECISIONS.md D-06): trusted admin path for public eligibility; PERSONAL_SUBSCRIPTION is always refused.'
      parameters:
        - {in: path, name: resource_id, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                license_reference: {type: string, maxLength: 500}
      responses:
        '200':
          description: resource approved and publicly eligible
          content:
            application/json:
              schema:
                type: object
                required: [id, resource_type, authorization_status, public_eligible]
                properties:
                  id: {type: string, format: uuid}
                  resource_type: {type: string}
                  authorization_status: {type: string}
                  public_eligible: {type: boolean}
        '403': {$ref: '#/components/responses/ApiError'}
        '404': {$ref: '#/components/responses/ApiError'}
        '422': {$ref: '#/components/responses/ApiError'}
  /v1/experiments/groups:
    post:
      operationId: createExperimentalGroup
      x-spareagent-extension: W4 experimental scope (docs/WEEK4_SUBSCRIPTION_STATUS.md). Invitation-only, non-commercial; cross-user execution is SIMULATED only in this build.
      description: ADMIN (operator) only. max_members is capped by EXPERIMENT_MAX_GROUP_MEMBERS (default 5).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExperimentalGroupCreate'
      responses:
        '201':
          description: group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentalGroup'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
        '422':
          $ref: '#/components/responses/ApiError'
  /v1/experiments/groups/{group_id}:
    get:
      operationId: getExperimentalGroup
      x-spareagent-extension: W4 experimental scope (docs/WEEK4_SUBSCRIPTION_STATUS.md). Invitation-only, non-commercial; cross-user execution is SIMULATED only in this build.
      description: Operator, or a member of the group (others get 404).
      parameters:
      - in: path
        name: group_id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: group with members and current authorization record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentalGroup'
        '401':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
  /v1/experiments/groups/{group_id}/invite:
    post:
      operationId: inviteExperimentalMember
      x-spareagent-extension: W4 experimental scope (docs/WEEK4_SUBSCRIPTION_STATUS.md). Invitation-only, non-commercial; cross-user execution is SIMULATED only in this build.
      description: ADMIN only. Fails with 409 GROUP_FULL at the membership cap.
      parameters:
      - in: path
        name: group_id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExperimentalInvite'
      responses:
        '201':
          description: member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentalMember'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
        '409':
          $ref: '#/components/responses/ApiError'
        '422':
          $ref: '#/components/responses/ApiError'
  /v1/experiments/groups/{group_id}/join:
    post:
      operationId: joinExperimentalGroup
      x-spareagent-extension: W4 experimental scope (docs/WEEK4_SUBSCRIPTION_STATUS.md). Invitation-only, non-commercial; cross-user execution is SIMULATED only in this build.
      description: Invited users only, with every required acknowledgement and the current terms version.
      parameters:
      - in: path
        name: group_id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExperimentalConsent'
      responses:
        '200':
          description: member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentalMember'
        '401':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
        '409':
          $ref: '#/components/responses/ApiError'
        '422':
          $ref: '#/components/responses/ApiError'
  /v1/experiments/groups/{group_id}/authorizations:
    post:
      operationId: recordExperimentalAuthorization
      x-spareagent-extension: W4 experimental scope (docs/WEEK4_SUBSCRIPTION_STATUS.md). Invitation-only, non-commercial; cross-user execution is SIMULATED only in this build.
      description: ADMIN only. Stores an opaque reference to private correspondence (never its text). Created UNVERIFIED.
      parameters:
      - in: path
        name: group_id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExperimentalAuthorizationCreate'
      responses:
        '201':
          description: authorization record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentalAuthorization'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
        '422':
          $ref: '#/components/responses/ApiError'
  /v1/experiments/authorizations/{authorization_id}/verify:
    post:
      operationId: verifyExperimentalAuthorization
      x-spareagent-extension: W4 experimental scope (docs/WEEK4_SUBSCRIPTION_STATUS.md). Invitation-only, non-commercial; cross-user execution is SIMULATED only in this build.
      description: ADMIN only. Records the operator's verification decision. Does not enable live execution.
      parameters:
      - in: path
        name: authorization_id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExperimentalAuthorizationVerify'
      responses:
        '200':
          description: authorization record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentalAuthorization'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
        '409':
          $ref: '#/components/responses/ApiError'
        '422':
          $ref: '#/components/responses/ApiError'
  /v1/experiments/authorizations/{authorization_id}/revoke:
    post:
      operationId: revokeExperimentalAuthorization
      x-spareagent-extension: W4 experimental scope (docs/WEEK4_SUBSCRIPTION_STATUS.md). Invitation-only, non-commercial; cross-user execution is SIMULATED only in this build.
      description: ADMIN only.
      parameters:
      - in: path
        name: authorization_id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: authorization record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentalAuthorization'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
  /v1/experiments/groups/{group_id}/sharing:
    post:
      operationId: setGroupSharing
      x-spareagent-extension: W4 experimental scope (docs/WEEK4_SUBSCRIPTION_STATUS.md). Invitation-only, non-commercial; cross-user execution is SIMULATED only in this build.
      description: ADMIN only. Group-level sharing switch (default off).
      parameters:
      - in: path
        name: group_id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExperimentalGroupSharing'
      responses:
        '200':
          description: group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentalGroup'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
        '409':
          $ref: '#/components/responses/ApiError'
        '422':
          $ref: '#/components/responses/ApiError'
  /v1/experiments/kill-switch:
    post:
      operationId: experimentKillSwitch
      x-spareagent-extension: W4 experimental scope (docs/WEEK4_SUBSCRIPTION_STATUS.md). Invitation-only, non-commercial; cross-user execution is SIMULATED only in this build.
      description: ADMIN only. Disables every group and cancels every unfinished experimental task.
      responses:
        '200':
          description: result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentalKillSwitch'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
  /v1/experiments/groups/{group_id}/audit:
    get:
      operationId: listExperimentalAudit
      x-spareagent-extension: W4 experimental scope (docs/WEEK4_SUBSCRIPTION_STATUS.md). Invitation-only, non-commercial; cross-user execution is SIMULATED only in this build.
      description: ADMIN only. Append-only cross-user scheduling decisions, newest first.
      parameters:
      - in: path
        name: group_id
        required: true
        schema:
          type: string
          format: uuid
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
      responses:
        '200':
          description: decisions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExperimentalDispatchDecision'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
        '422':
          $ref: '#/components/responses/ApiError'
  /v1/subscriptions/connect:
    post:
      operationId: connectSubscription
      x-spareagent-extension: W4 experimental scope (docs/WEEK4_SUBSCRIPTION_STATUS.md). Invitation-only, non-commercial; cross-user execution is SIMULATED only in this build.
      description: Owner links their own PERSONAL_SUBSCRIPTION node. Only auth_method=CHATGPT is accepted. Unknown fields (e.g. any token) are rejected; credentials never leave the owner's device.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionConnect'
      responses:
        '201':
          description: connection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionConnection'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
        '422':
          $ref: '#/components/responses/ApiError'
  /v1/subscriptions/attest:
    post:
      operationId: attestSubscription
      x-spareagent-extension: 'W4 experimental scope (docs/WEEK4_SUBSCRIPTION_STATUS.md). Invitation-only, non-commercial.'
      description: Owner only. Records the codex-check result and the no-purchased-credits / no-auto-reload attestation required for LIVE shared tasks. Sending a failing result or false withdraws it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionAttest'
      responses:
        '200':
          description: connection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionConnection'
        '401': {$ref: '#/components/responses/ApiError'}
        '404': {$ref: '#/components/responses/ApiError'}
        '422': {$ref: '#/components/responses/ApiError'}
  /v1/subscriptions/enrollment-tokens:
    post:
      operationId: createDeviceEnrollmentToken
