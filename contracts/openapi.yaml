openapi: 3.1.0
info:
  title: SpareAgent MVP API
  version: 1.1.0
  description: 'W1: Tasks, Events, Models, Chat nonstream, health. W2: remote worker enrollment, node credentials and lease protocol.'
servers:
  - url: http://localhost:8000
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      operationId: health
      security: []
      responses:
        '200': {description: alive}
  /readyz:
    get:
      operationId: ready
      security: []
      responses:
        '200': {description: dependencies ready}
        '503': {description: unavailable}
  /v1/tasks:
    post:
      operationId: createTask
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string, minLength: 8, maxLength: 128}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TaskCreate'}
      responses:
        '202':
          description: accepted or same-key replay
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Task'}
        '400': {$ref: '#/components/responses/ApiError'}
        '401': {$ref: '#/components/responses/ApiError'}
        '409': {$ref: '#/components/responses/ApiError'}
        '422': {$ref: '#/components/responses/ApiError'}
    get:
      operationId: listTasks
      parameters:
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {in: query, name: cursor, schema: {type: string}}
      responses:
        '200':
          description: paginated tasks for current user
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Task'}}
                  next_cursor: {type: [string, 'null']}
  /v1/tasks/{task_id}:
    get:
      operationId: getTask
      parameters: [{$ref: '#/components/parameters/TaskId'}]
      responses:
        '200': {description: task, content: {application/json: {schema: {$ref: '#/components/schemas/Task'}}}}
        '403': {$ref: '#/components/responses/ApiError'}
        '404': {$ref: '#/components/responses/ApiError'}
  /v1/tasks/{task_id}/cancel:
    post:
      operationId: cancelTask
      parameters: [{$ref: '#/components/parameters/TaskId'}]
      responses:
        '202': {description: cancellation requested, content: {application/json: {schema: {$ref: '#/components/schemas/Task'}}}}
        '409': {$ref: '#/components/responses/ApiError'}
  /v1/tasks/{task_id}/events:
    get:
      operationId: streamTaskEvents
      parameters:
        - {$ref: '#/components/parameters/TaskId'}
        - {in: header, name: Last-Event-ID, schema: {type: string}}
      responses:
        '200':
          description: SSE stream, event.id is monotonically increasing seq
          content:
            text/event-stream:
              schema: {type: string}
  /v1/tasks/{task_id}/artifacts:
    get:
      operationId: listTaskArtifacts
      parameters: [{$ref: '#/components/parameters/TaskId'}]
      responses:
        '200':
          description: artifact descriptors (authorization required)
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Artifact'}}
  /v1/models:
    get:
      operationId: listModels
      responses:
        '200':
          description: available approved model aliases
          content:
            application/json:
              schema:
                type: object
                properties:
                  object: {type: string, const: list}
                  data: {type: array, items: {$ref: '#/components/schemas/Model'}}
  /v1/chat/completions:
    post:
      operationId: createChatCompletion
      description: W1 only nonstream and mock provider; stream=true explicitly returns 422.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChatRequest'}
      responses:
        '200':
          description: generated response
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChatResponse'}
        '404': {$ref: '#/components/responses/ApiError'}
        '422': {$ref: '#/components/responses/ApiError'}
        '429': {$ref: '#/components/responses/ApiError'}
  /v1/enrollment-tokens:
    post:
      operationId: createEnrollmentToken
      description: 'W2. ADMIN for any public-type resource, or PROVIDER for an own admin-APPROVED resource. PERSONAL_SUBSCRIPTION is always refused. Token is single use and shown once.'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EnrollmentCreate'}
      responses:
        '201':
          description: enrollment token (secret shown once)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EnrollmentToken'}
        '401': {$ref: '#/components/responses/ApiError'}
        '403': {$ref: '#/components/responses/ApiError'}
        '404': {$ref: '#/components/responses/ApiError'}
        '422': {$ref: '#/components/responses/ApiError'}
  /v1/admin/workers/{worker_id}/revoke:
    post:
      operationId: revokeWorker
      description: 'W2. ADMIN only. Revokes all node credentials and expires active leases (tasks are retried or failed).'
      parameters: [{$ref: '#/components/parameters/WorkerId'}]
      responses:
        '200':
          description: revoked
          content:
            application/json:
              schema:
                type: object
                required: [worker_id, revoked, leases_expired]
                properties:
                  worker_id: {type: string, format: uuid}
                  revoked: {type: boolean}
                  leases_expired: {type: integer}
        '403': {$ref: '#/components/responses/ApiError'}
        '404': {$ref: '#/components/responses/ApiError'}
  /v1/workers/register:
    post:
      operationId: registerWorker
      description: 'W2. Authorization: Bearer <enrollment token>. Anonymous or consumer/dev authentication is rejected. Registration never grants marketplace eligibility.'
      security: [{enrollmentToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WorkerRegistration'}
      responses:
        '201':
          description: created worker; node key and access token shown once
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NodeRegistration'}
        '401': {$ref: '#/components/responses/ApiError'}
        '403': {$ref: '#/components/responses/ApiError'}
        '422': {$ref: '#/components/responses/ApiError'}
  /v1/workers/token:
    post:
      operationId: exchangeNodeKey
      description: 'W2. Authorization: Bearer <node key>. Returns a short-lived node-scoped access token.'
      security: [{nodeKey: []}]
      responses:
        '200':
          description: access token
          content:
            application/json:
              schema:
                type: object
                required: [worker_id, access_token, expires_at]
                properties:
                  worker_id: {type: string, format: uuid}
                  access_token: {type: string}
                  expires_at: {type: string, format: date-time}
        '401': {$ref: '#/components/responses/ApiError'}
  /v1/workers/me:
    get:
      operationId: getWorkerSelf
      security: [{nodeAuth: []}]
      responses:
        '200':
          description: this node as seen by the API
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkerSelf'}
        '401': {$ref: '#/components/responses/ApiError'}
  /v1/workers/{worker_id}/credentials/rotate:
    post:
      operationId: rotateNodeCredentials
      description: 'W2. Revokes every live credential of the node and issues a new node key + access token.'
      security: [{nodeAuth: []}]
      parameters: [{$ref: '#/components/parameters/WorkerId'}]
      responses:
        '200':
          description: rotated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NodeRegistration'}
        '401': {$ref: '#/components/responses/ApiError'}
        '403': {$ref: '#/components/responses/ApiError'}
  /v1/workers/{worker_id}/heartbeat:
    post:
      operationId: workerHeartbeat
      security: [{nodeAuth: []}]
      parameters: [{$ref: '#/components/parameters/WorkerId'}]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                state: {type: string, enum: [ONLINE, DRAINING, OFFLINE], default: ONLINE}
                capabilities: {type: object}
      responses:
        '204': {description: heartbeat recorded}
        '401': {$ref: '#/components/responses/ApiError'}
        '403': {$ref: '#/components/responses/ApiError'}
  /v1/workers/{worker_id}/leases/next:
    get:
      operationId: pollLease
      description: 'W2. Bounded long poll (server caps wait). Returns an existing reservation for this node or atomically claims the oldest eligible task within the node''s capacity.'
      security: [{nodeAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/WorkerId'}
        - {in: query, name: wait_seconds, schema: {type: number, minimum: 0, maximum: 60, default: 20}}
      responses:
        '200':
          description: lease assignment
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LeaseAssignment'}
        '204': {description: no work within the wait window}
        '401': {$ref: '#/components/responses/ApiError'}
        '403': {$ref: '#/components/responses/ApiError'}
  /v1/leases/{lease_id}/accept:
    post:
      operationId: acceptLease
      security: [{nodeAuth: []}]
      parameters: [{$ref: '#/components/parameters/LeaseId'}]
      responses:
        '204': {description: accepted}
        '403': {$ref: '#/components/responses/ApiError'}
        '409': {$ref: '#/components/responses/ApiError'}
  /v1/leases/{lease_id}/progress:
    post:
      operationId: reportLeaseProgress
      description: 'W2. Records a progress event and renews the lease; cancel_requested tells the node to stop.'
      security: [{nodeAuth: []}]
      parameters: [{$ref: '#/components/parameters/LeaseId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [message, percent]
              properties:
                message: {type: string, maxLength: 500}
                percent: {type: integer, minimum: 0, maximum: 100}
      responses:
        '200':
          description: lease state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LeaseState'}
        '403': {$ref: '#/components/responses/ApiError'}
        '409': {$ref: '#/components/responses/ApiError'}
  /v1/leases/{lease_id}/renew:
    post:
      operationId: renewLease
      security: [{nodeAuth: []}]
      parameters: [{$ref: '#/components/parameters/LeaseId'}]
      responses:
        '200':
          description: lease state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LeaseState'}
        '403': {$ref: '#/components/responses/ApiError'}
        '409': {$ref: '#/components/responses/ApiError'}
  /v1/leases/{lease_id}/complete:
    post:
      operationId: completeLease
      description: 'Finalizes an attempt exactly once per finalization_key; replay with the same key returns replayed=true. Usage is computed by the API, never reported by the node. Retryability is decided by the API.'
      security: [{nodeAuth: []}]
      parameters: [{$ref: '#/components/parameters/LeaseId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LeaseCompletion'}
      responses:
        '200':
          description: 'finalized; idempotent replay permitted'
          content:
            application/json:
              schema:
                type: object
                required: [task_status, replayed]
                properties:
                  task_status: {type: string}
                  replayed: {type: boolean}
        '403': {$ref: '#/components/responses/ApiError'}
        '409': {$ref: '#/components/responses/ApiError'}
        '413': {$ref: '#/components/responses/ApiError'}
        '422': {$ref: '#/components/responses/ApiError'}
  /v1/tasks/{task_id}/artifacts/{artifact_id}/content:
    get:
      operationId: getTaskArtifactContent
      x-spareagent-extension: 'W1 addition (docs/DECISIONS.md D-07): owner-only artifact download, served as attachment with nosniff.'
      parameters:
        - {$ref: '#/components/parameters/TaskId'}
        - {in: path, name: artifact_id, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: raw artifact bytes; X-Artifact-SHA256 header carries the digest
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        '404': {$ref: '#/components/responses/ApiError'}
  /v1/admin/resources/{resource_id}/approve:
    post:
      operationId: approveResource
      x-spareagent-extension: 'W1 addition (docs/DECISIONS.md D-06): trusted admin path for public eligibility; PERSONAL_SUBSCRIPTION is always refused.'
      parameters:
        - {in: path, name: resource_id, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                license_reference: {type: string, maxLength: 500}
      responses:
        '200':
          description: resource approved and publicly eligible
          content:
            application/json:
              schema:
                type: object
                required: [id, resource_type, authorization_status, public_eligible]
                properties:
                  id: {type: string, format: uuid}
                  resource_type: {type: string}
                  authorization_status: {type: string}
                  public_eligible: {type: boolean}
        '403': {$ref: '#/components/responses/ApiError'}
        '404': {$ref: '#/components/responses/ApiError'}
        '422': {$ref: '#/components/responses/ApiError'}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
    enrollmentToken: {type: http, scheme: bearer, description: 'single-use sa_enr_ token'}
    nodeKey: {type: http, scheme: bearer, description: 'long-lived sa_nk_ node key (token exchange only)'}
    nodeAuth: {type: http, scheme: bearer, description: 'short-lived node-scoped sa_at_ access token'}
  parameters:
    WorkerId:
      in: path
      name: worker_id
      required: true
      schema: {type: string, format: uuid}
    LeaseId:
      in: path
      name: lease_id
      required: true
      schema: {type: string, format: uuid}
    TaskId:
      in: path
      name: task_id
      required: true
      schema: {type: string, format: uuid}
  responses:
    ApiError:
      description: standard error envelope
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
  schemas:
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code: {type: string}
            message: {type: string}
            request_id: {type: string}
    TaskCreate:
      type: object
      additionalProperties: false
      required: [task_type, repository_url, commit_sha, prompt, max_budget_cents, max_duration_seconds]
      properties:
        task_type: {type: string, enum: [CODE_FIX, REFACTOR, WRITE_TESTS]}
        repository_url: {type: string, format: uri, pattern: '^https://github\.com/'}
        commit_sha: {type: string, pattern: '^[a-fA-F0-9]{40}$'}
        prompt: {type: string, minLength: 1, maxLength: 12000}
        max_budget_cents: {type: integer, minimum: 1, maximum: 10000000}
        max_duration_seconds: {type: integer, minimum: 10, maximum: 7200}
    Task:
      type: object
      required: [id, status, task_type, max_budget_cents, created_at]
      properties:
        id: {type: string, format: uuid}
        status: {type: string, enum: [CREATED, QUEUED, RESERVED, RUNNING, VERIFYING, RETRY_PENDING, CANCELLING, SUCCEEDED, FAILED, CANCELLED, TIMED_OUT]}
        task_type: {type: string}
        max_budget_cents: {type: integer}
        created_at: {type: string, format: date-time}
        result_summary: {type: [string, 'null']}
    Artifact:
      type: object
      required: [id, kind, sha256, media_type]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [PATCH, TEST_REPORT, LOG, SUMMARY]}
        sha256: {type: string}
        media_type: {type: string}
    Model:
      type: object
      required: [id, object, owned_by]
      properties:
        id: {type: string}
        object: {type: string, const: model}
        owned_by: {type: string}
    ChatRequest:
      type: object
      required: [model, messages]
      properties:
        model: {type: string}
        stream: {type: boolean, default: false}
        max_tokens: {type: integer, minimum: 1, maximum: 8192}
        temperature: {type: number, minimum: 0, maximum: 2}
        messages:
          type: array
          minItems: 1
          items:
            type: object
            required: [role, content]
            properties:
              role: {type: string, enum: [system, developer, user, assistant]}
              content: {type: string}
    ChatResponse:
      type: object
      required: [id, object, created, model, choices, usage]
      properties:
        id: {type: string}
        object: {type: string, const: chat.completion}
        created: {type: integer}
        model: {type: string}
        choices:
          type: array
          items:
            type: object
            required: [index, message, finish_reason]
            properties:
              index: {type: integer}
              message:
                type: object
                required: [role, content]
                properties:
                  role: {type: string, const: assistant}
                  content: {type: string}
              finish_reason: {type: string}
        usage:
          type: object
          required: [prompt_tokens, completion_tokens, total_tokens]
          properties:
            prompt_tokens: {type: integer}
            completion_tokens: {type: integer}
            total_tokens: {type: integer}
    WorkerRegistration:
      type: object
      additionalProperties: false
      required: [resource_id, name, capabilities]
      properties:
        resource_id: {type: string, format: uuid}
        name: {type: string, pattern: '^[A-Za-z0-9._-]{1,100}$'}
        capabilities: {type: object}
        max_concurrency: {type: integer, minimum: 1, maximum: 100, default: 1}
    NodeRegistration:
      type: object
      required: [worker_id, node_key, node_key_expires_at, access_token, access_token_expires_at]
      properties:
        worker_id: {type: string, format: uuid}
        node_key: {type: string}
        node_key_expires_at: {type: string, format: date-time}
        access_token: {type: string}
        access_token_expires_at: {type: string, format: date-time}
    EnrollmentCreate:
      type: object
      additionalProperties: false
      required: [resource_id]
      properties:
        resource_id: {type: string, format: uuid}
        ttl_seconds: {type: integer, minimum: 60, maximum: 604800, default: 3600}
    EnrollmentToken:
      type: object
      required: [id, token, resource_id, expires_at]
      properties:
        id: {type: string, format: uuid}
        token: {type: string}
        resource_id: {type: string, format: uuid}
        expires_at: {type: string, format: date-time}
    WorkerSelf:
      type: object
      required: [worker_id, resource_id, name, status, max_concurrency, active_tasks]
      properties:
        worker_id: {type: string, format: uuid}
        resource_id: {type: string, format: uuid}
        name: {type: string}
        status: {type: string}
        max_concurrency: {type: integer}
        active_tasks: {type: integer}
        last_heartbeat: {type: [string, 'null'], format: date-time}
    LeaseAssignment:
      type: object
      required: [lease_id, attempt_id, attempt_number, leased_until, lease_seconds, task]
      properties:
        lease_id: {type: string, format: uuid}
        attempt_id: {type: string, format: uuid}
        attempt_number: {type: integer}
        leased_until: {type: string, format: date-time}
        lease_seconds: {type: integer}
        task:
          type: object
          required: [task_id, task_type, repository_url, commit_sha, prompt, max_duration_seconds, max_budget_cents]
          properties:
            task_id: {type: string, format: uuid}
            task_type: {type: string}
            repository_url: {type: string}
            commit_sha: {type: string}
            prompt: {type: string, description: 'secret-redacted before leaving the API'}
            max_duration_seconds: {type: integer}
            max_budget_cents: {type: integer}
    LeaseState:
      type: object
      required: [leased_until, cancel_requested]
      properties:
        leased_until: {type: [string, 'null'], format: date-time}
        cancel_requested: {type: boolean}
    LeaseCompletion:
      type: object
      additionalProperties: false
      required: [finalization_key, succeeded]
      properties:
        finalization_key: {type: string, minLength: 8, maxLength: 128}
        succeeded: {type: boolean}
        result_summary: {type: string, maxLength: 2000}
        retryable: {type: boolean, default: false}
        error_code: {type: string, enum: [TRANSIENT_PROVIDER_ERROR, PERMANENT_PROVIDER_ERROR, NO_RESULT, WORKER_SHUTDOWN, CANCELLED, EXECUTION_ERROR]}
        timed_out: {type: boolean, default: false}
        artifacts:
          type: array
          maxItems: 8
          items:
            type: object
            additionalProperties: false
            required: [kind, name, media_type, content_base64]
            properties:
              kind: {type: string, enum: [PATCH, TEST_REPORT, LOG, SUMMARY]}
              name: {type: string, pattern: '^[A-Za-z0-9._-]{1,100}$'}
              media_type: {type: string, enum: [text/plain, text/x-diff, application/json]}
              content_base64: {type: string}
