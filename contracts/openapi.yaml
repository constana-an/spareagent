      - items
    ExperimentalTaskCreate:
      type: object
      properties:
        group_id:
          type: string
          format: uuid
        connection_id:
          type: string
          format: uuid
        task_type:
          type: string
          enum:
          - CODE_REVIEW
          - WRITE_TESTS
          - CODE_FIX
        repository_url:
          type: string
          format: uri
          pattern: ^https://github\.com/
        commit_sha:
          type: string
          pattern: ^[a-fA-F0-9]{40}$
        prompt:
          type: string
          minLength: 1
          maxLength: 12000
