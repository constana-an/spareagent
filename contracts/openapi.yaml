    ExperimentalTaskCreate:
      type: object
      description: '0011 generic task. Omit kind/task_type for GENERAL; give at most one kind alias and exactly one of requirement/prompt; repository (or legacy repository_url + commit_sha) only for kinds that need one.'
      additionalProperties: false
      required: [group_id, connection_id, max_duration_seconds]
      properties:
        group_id: {type: string, format: uuid}
        connection_id: {type: string, format: uuid}
        kind: {anyOf: [{type: string, enum: [CODE_REVIEW, CODE_FIX, WRITE_TESTS, CODE_CHANGE, TRANSLATE_DOCUMENT, ANALYZE_SPREADSHEET, GENERAL]}, {type: 'null'}]}
        task_type: {anyOf: [{type: string, enum: [CODE_REVIEW, CODE_FIX, WRITE_TESTS, CODE_CHANGE, TRANSLATE_DOCUMENT, ANALYZE_SPREADSHEET, GENERAL]}, {type: 'null'}], description: legacy alias of kind}
        requirement: {anyOf: [{type: string, minLength: 1, maxLength: 12000}, {type: 'null'}]}
        prompt: {anyOf: [{type: string, minLength: 1, maxLength: 12000}, {type: 'null'}], description: legacy alias of requirement}
        repository:
          anyOf:
            - type: object
              additionalProperties: false
              required: [url, commit_sha]
              properties:
                url: {type: string, pattern: '^https://github\.com/'}
                commit_sha: {type: string, pattern: '^[a-fA-F0-9]{40}$'}
            - {type: 'null'}
        repository_url: {anyOf: [{type: string, pattern: '^https://github\.com/'}, {type: 'null'}]}
        commit_sha: {anyOf: [{type: string, pattern: '^[a-fA-F0-9]{40}$'}, {type: 'null'}]}
        parent_task_id: {type: [string, 'null'], format: uuid, description: 'Finished task belonging to this requester, group and device'}
        attachments: {type: array, maxItems: 5, items: {type: string, format: uuid}}
        parameters: {type: object, maxProperties: 10, additionalProperties: {type: string, maxLength: 100}}
        deliverable:
          anyOf:
            - type: object
              additionalProperties: false
              properties:
                format: {anyOf: [{type: string, pattern: '^[a-z0-9]{1,8}$'}, {type: 'null'}]}
            - {type: 'null'}
        max_duration_seconds: {type: [integer, 'null'], minimum: 10, maximum: 3600, description: 'null means no execution time limit; both owner and group must allow it'}
        execution_mode: {type: string, enum: [SIMULATED, LIVE], default: SIMULATED}
        network_access: {type: boolean, default: false, description: 'needs internet; dispatched only to a device whose owner allows "network"'}
