    ExperimentalTask:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
        task_type:
          type: string
        resource_scope:
          type: string
          const: EXPERIMENTAL_SHARED_SUBSCRIPTION
        execution_mode:
          type: string
          enum:
          - SIMULATED
          - LIVE
        group_id:
          type: string
          format: uuid
        connection_id:
          type: string
          format: uuid
        requester_id:
          type: string
          format: uuid
        owner_id:
          type: string
          format: uuid
        approval_status:
          type: string
          enum:
          - PENDING
          - APPROVED
          - REJECTED
          - WITHDRAWN
